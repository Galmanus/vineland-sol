[package]
name = "vineland-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The off-chain half of Vineland on Solana: notes, the deposit tree, riverrun crowd proofs, the committee check, and the transactions that settle them."

[dependencies]
# riverrun's Circle-STARK crowd proofs and the staged on-chain verifier
# (github.com/Galmanus/mirror-pool at ce5e8c7, the worktree that carries the
# recipient-bound provers and the staged buffer protocol); expected checked out
# next to this repo.
riverrun-m31 = { path = "../../mirror-pool/.claude/worktrees/agent-ae0080ba263a865c1/crates/riverrun-m31", features = ["wire-postcard"] }
# Only for its host-side helpers (`client`, the `staged` layout constants and
# the round encoding). Without default features the program's custom heap is
# off. Its `entrypoint!` is NOT gated by `no-entrypoint` (lib.rs at ce5e8c7),
# so it exports a native `entrypoint` symbol: no other dependency may export
# one too, hence spl-token's `no-entrypoint` below (without it, the link fails
# with "duplicate symbol: entrypoint").
riverrun-m31-verifier = { path = "../../mirror-pool/.claude/worktrees/agent-ae0080ba263a865c1/programs/riverrun-m31-verifier", default-features = false, features = ["no-entrypoint"] }
solana-sdk = "2"
solana-client = "2"
spl-token = { version = "7", features = ["no-entrypoint"] }
spl-associated-token-account-client = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = { version = "0.4", features = ["serde"] }

[dev-dependencies]
litesvm = "0.6"

# Cargo applies [patch] only from the build root, so riverrun-m31's own patches
# are repeated here (same reason as programs/riverrun-m31-verifier upstream).
# p3-uni-stark's carries `verify_with_known_quotient_chunks`, which the crowd
# verifier calls, so this is required even for native builds.
[patch.crates-io]
p3-util = { path = "../../mirror-pool/.claude/worktrees/agent-ae0080ba263a865c1/crates/riverrun-m31/vendor/p3-util-0.6.2-sbf-patch" }
p3-mersenne-31 = { path = "../../mirror-pool/.claude/worktrees/agent-ae0080ba263a865c1/crates/riverrun-m31/vendor/p3-mersenne-31-0.6.2-sbf-patch" }
p3-uni-stark = { path = "../../mirror-pool/.claude/worktrees/agent-ae0080ba263a865c1/crates/riverrun-m31/vendor/p3-uni-stark-0.6.2-heap-patch" }
p3-circle = { path = "../../mirror-pool/.claude/worktrees/agent-ae0080ba263a865c1/crates/riverrun-m31/vendor/p3-circle-0.6.2-cutrace-patch" }

# Proving is slow unoptimized; tests that prove run with --release.
[profile.dev.package."*"]
opt-level = 3

[package]
name = "vineland-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The off-chain half of Vineland on Solana: notes, the deposit tree, riverrun crowd proofs, the committee check, and the transactions that settle them."

[dependencies]
# riverrun's Circle-STARK crowd proofs and the staged on-chain verifier
# (github.com/Galmanus/mirror-pool, branch feat/staged-onchain-verifier, pinned
# at ce5e8c7: the recipient-bound provers and the staged buffer protocol).
riverrun-m31 = { git = "https://github.com/Galmanus/mirror-pool", rev = "ce5e8c7cfe55e116c2139f5413e76c961848079c", features = ["wire-postcard"] }
# Only for its host-side helpers (`client`, the `staged` layout constants and
# the round encoding). Without default features the program's custom heap is
# off. Its `entrypoint!` is NOT gated by `no-entrypoint` (lib.rs at ce5e8c7),
# so it exports a native `entrypoint` symbol: no other dependency may export
# one too, hence spl-token's `no-entrypoint` below (without it, the link fails
# with "duplicate symbol: entrypoint").
riverrun-m31-verifier = { git = "https://github.com/Galmanus/mirror-pool", rev = "ce5e8c7cfe55e116c2139f5413e76c961848079c", default-features = false, features = ["no-entrypoint"] }
solana-sdk = "2"
solana-client = "2"
spl-token = { version = "7", features = ["no-entrypoint"] }
spl-associated-token-account-client = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = { version = "0.4", features = ["serde"] }
# The relayer's HTTP server: synchronous, like the blocking RpcClient it
# drives, so no async runtime bridge (adds tiny_http, ascii 1, chunked_transfer).
tiny_http = "0.12"
# vineland-node hands unsigned transactions to the browser wallet (Privy) to sign
bincode = "1.3.3"
base64 = "0.22.1"
# The CLI's HTTP client for the relayer. Already in the lock through
# solana-rpc-client with exactly these features, so this adds no crate.
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json"] }

[dev-dependencies]
litesvm = "0.6"

# Cargo applies [patch] only from the build root, so riverrun-m31's own patches
# are repeated here (same reason as programs/riverrun-m31-verifier upstream).
# p3-uni-stark's carries `verify_with_known_quotient_chunks`, which the crowd
# verifier calls, so this is required even for native builds.
[patch.crates-io]
p3-util = { git = "https://github.com/Galmanus/mirror-pool", rev = "ce5e8c7cfe55e116c2139f5413e76c961848079c" }
p3-mersenne-31 = { git = "https://github.com/Galmanus/mirror-pool", rev = "ce5e8c7cfe55e116c2139f5413e76c961848079c" }
p3-uni-stark = { git = "https://github.com/Galmanus/mirror-pool", rev = "ce5e8c7cfe55e116c2139f5413e76c961848079c" }
p3-circle = { git = "https://github.com/Galmanus/mirror-pool", rev = "ce5e8c7cfe55e116c2139f5413e76c961848079c" }

# Proving is slow unoptimized; tests that prove run with --release.
[profile.dev.package."*"]
opt-level = 3
